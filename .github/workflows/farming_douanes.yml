name: farming-douanes
on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: farming-commit
  cancel-in-progress: false
defaults:
  run:
    working-directory: farming
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Interroger les API des douanes
        env:
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
        run: python scripts/maj_douanes.py --config douanes_config.json --sortie donnees_douanes --strict
      - name: Publier les changements
        if: always()
        run: |
          git config user.name "farming-douanes"; git config user.email "actions@users.noreply.github.com"
          git add -A .   # uniquement le dossier farming/
          git diff --cached --quiet && exit 0
          git commit -m "Douanes $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
