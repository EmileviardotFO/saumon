name: Suisse - importations de saumon (douanes suisses, donnees ouvertes)
# Une fois par semaine : le fichier des douanes suisses (8,6 Go) est relu et seul le saumon est garde.
on:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maj-suisse
  cancel-in-progress: false
jobs:
  suisse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Douanes suisses
        run: python3 scripts/build_swiss_imports.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/swiss_imports.json
          if git diff --staged --quiet; then echo "Aucun changement."; else
            git commit -q -m "Suisse : importations de saumon ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done; fi
