name: Canada - exportations mensuelles de saumon par province (Statistique Canada, CIMT)
# Statistique Canada publie le commerce d'un mois environ 5 semaines plus tard : relecture deux fois par semaine.
on:
  schedule:
    - cron: '41 13 * * 2,5'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: maj-canada-commerce
  cancel-in-progress: false
jobs:
  cimt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Lire les exportations (CIMT)
        run: python3 scripts/build_canada_trade.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/canada_trade.json
          if git diff --staged --quiet; then echo "Aucun changement."; else
            git commit -q -m "Canada : exportations mensuelles par province ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done; fi
