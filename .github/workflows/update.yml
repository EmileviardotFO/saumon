name: Mise a jour des donnees

on:
  push:
    paths:
      - 'pdf/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parser les nouveaux rapports
        run: python3 scripts/parse_akvafakta.py

      - name: Publier data.json
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Donnees mises a jour ($(date +%Y-%m-%d))"
            git push
          fi
