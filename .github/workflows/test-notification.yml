name: Test - notifications (registre de la biomasse, alertes par ferme)

# Envoie a la main la notification du dernier mois publie, marquee [TEST], sur le canal ntfy du secret NTFY_TOPIC.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Envoyer la notification de test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: '1'
        run: python3 scripts/notify_biomasse.py
      - name: Envoyer l'alerte par ferme de test (dernier evenement connu)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: '1'
        run: python3 scripts/build_site_alerts.py
