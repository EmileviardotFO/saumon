name: Temperature de la mer (NOAA OISST, quotidien)

on:
  schedule:
  - cron: 17 5 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sst:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Temperature de la mer et jours de chaleur par bassin
      run: |
        curl -sS -g -m 60 'https://coastwatch.pfeg.noaa.gov/erddap/griddap/ncdcOisst21Agg_LonPM180.csv?sst[last-2:1:last][(0.0)][(62.125)][(-6.875)]' || true
        python3 -u scripts/build_sea_temp.py
    - name: Enregistrer
      if: always()
      run: |
        git config user.name "github-actions"; git config user.email "actions@github.com"
        git add data/sea_temp.json
        git diff --cached --quiet && exit 0
        git commit -m "Temperature de la mer ($(date -u +%Y-%m-%d))"
        for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
