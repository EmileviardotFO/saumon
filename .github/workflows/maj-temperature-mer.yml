name: Temperature de la mer (Open-Meteo, quotidien)

on:
  schedule:
  - cron: 17 5 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sst:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Temperature de la mer et jours de chaleur par bassin
      run: |
        curl -sS -m 30 -o /dev/null -w 'sonde Open-Meteo : %{http_code} en %{time_total}s\n' 'https://marine-api.open-meteo.com/v1/marine?latitude=62&longitude=5&hourly=sea_surface_temperature&past_days=2&forecast_days=1' || true
        python3 -u scripts/build_sea_temp.py
    - name: Enregistrer
      if: always()
      run: |
        git config user.name "github-actions"; git config user.email "actions@github.com"
        git add data/sea_temp.json
        git diff --cached --quiet && exit 0
        git commit -m "Temperature de la mer ($(date -u +%Y-%m-%d))"
        for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
