name: Sondes des sources (BarentsWatch, Mattilsynet, GACC, Eurostat, statistiques nationales)

# Lancement manuel uniquement : onglet Actions -> "Sondes des sources" -> Run
# workflow. Interroge chaque source a l'essai (BarentsWatch, Mattilsynet,
# douanes chinoises, Eurostat, statistiques d'exportation des Feroe, de l'Islande,
# du Royaume-Uni et du Chili) et enregistre des echantillons de reponse dans
# data/bw_probe/, data/establishments/, data/eurostat_probe/ et
# data/national_probe/, pour mettre au
# point ou depanner les scripts de mise a jour.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Interroger l'API BarentsWatch
        env:
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
        run: python3 scripts/probe_barentswatch.py

      - name: Listes d'etablissements agrees (Mattilsynet, douanes chinoises)
        continue-on-error: true
        run: python3 scripts/fetch_establishments.py

      - name: Sonde Eurostat Comext (flux de saumon dans l'UE)
        continue-on-error: true
        run: python3 scripts/probe_eurostat.py

      - name: Sonde des statistiques nationales (Feroe, Islande, Royaume-Uni, Chili)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/probe_national_trade.py

      - name: Publier les echantillons
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add data/bw_probe/ data/establishments/ data/eurostat_probe/ data/national_probe/
          if git diff --staged --quiet; then
            echo "Aucun echantillon nouveau."
          else
            git commit -m "Sonde des sources ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
