name: Telechargement + mise a jour automatique

on:
  schedule:
    # lundi / mercredi / vendredi a 6h UTC -- large marge sur le mercredi
    # (Akvafakta hebdo) et le 20 du mois (Fiskeridirektoratet)
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch: {}   # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

# Chaque source est independante : une etape en echec n'empeche ni les autres
# ni la publication (continue-on-error). Le resultat de chaque etape est ecrit
# dans data.json (panneau "Sources" du tableau de bord), et la derniere etape
# fait echouer le passage s'il y a eu un probleme, pour que GitHub previenne
# par e-mail.
jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances Python
        run: pip install pandas openpyxl playwright pycountry

      - name: Telecharger les derniers rapports Akvafakta (hebdo + mensuel)
        id: akva_fetch
        continue-on-error: true
        run: python3 scripts/fetch_akvafakta.py

      - name: Parser les nouveaux rapports Akvafakta
        id: akva_parse
        continue-on-error: true
        run: python3 scripts/parse_akvafakta.py

      - name: Verifier et telecharger le fichier Biomasseregisteret
        id: biomasse_fetch
        continue-on-error: true
        run: |
          mkdir -p xlsx/biomasse
          curl -sSfL -o /tmp/biostat-total-omr.xlsx \
            https://register.fiskeridir.no/biomassestatistikk/BIOSTAT-LAKS-OMR/biostat-total-omr.xlsx
          NEW_HASH=$(sha256sum /tmp/biostat-total-omr.xlsx | cut -d' ' -f1)
          OLD_HASH=$(cat xlsx/biomasse/.last-hash 2>/dev/null || echo "")
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            DEST="xlsx/biomasse/biostat-total-omr-$(date -u +%Y-%m-%d).xlsx"
            cp /tmp/biostat-total-omr.xlsx "$DEST"
            echo "$NEW_HASH" > xlsx/biomasse/.last-hash
            echo "dest=$DEST" >> "$GITHUB_ENV"
            echo "Nouveau fichier biomasse : $DEST"
          else
            echo "Biomasse : rien de nouveau depuis le dernier passage."
          fi

      - name: Reconstruire records et cohort si nouveau fichier biomasse
        id: biomasse_build
        continue-on-error: true
        # Nouveau fichier -> reconstruction. Sinon, reconstruction depuis le dernier
        # fichier deja archive si data.json a encore l'ancien format de cohort (sans
        # les flux par generation ajoutes pour l'onglet Generations).
        run: |
          if [ -n "${dest:-}" ]; then
            python3 scripts/update_biomasse.py "$dest"
          elif python3 -c "import json,sys; c=json.load(open('data/data.json')).get('cohort',[]); sys.exit(0 if c and 'dead_stk' not in c[0] else 1)"; then
            LAST=$(ls -1 xlsx/biomasse/biostat-total-omr-*.xlsx | sort | tail -1)
            echo "Ancien format de cohort : reconstruction depuis $LAST"
            python3 scripts/update_biomasse.py "$LAST"
          else
            echo "Biomasse : rien a reconstruire."
          fi

      - name: Exports par pays et par produit (SSB, avec revisions)
        # Au premier passage, le script remonte seul jusqu'a 2018 ; ensuite il
        # ne re-telecharge que les mois pas encore definitifs.
        id: ssb
        continue-on-error: true
        run: python3 scripts/parse_ssb.py

      - name: Exportations hebdomadaires de saumon (SSB, table 03024)
        # Volume (tonnes) et prix a l'export par semaine. Nouvelle source :
        # un echec n'empeche pas le reste de la mise a jour.
        id: ssb_weekly
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/update_ssb_weekly.py

      - name: Sante des poissons par zone (BarentsWatch)
        # Poux, temperature de la mer, maladies et traitements, par zone et par
        # semaine. Le script s'arrete seul avant la limite de 60 min.
        id: bw_health
        continue-on-error: true
        timeout-minutes: 60
        env:
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
        run: python3 scripts/update_barentswatch.py

      - name: Registre des sites d'elevage (BarentsWatch, une fois par mois)
        # Fiche de chaque site : licences, capacite (MTB), exploitants, cages
        # d'attente d'abattage. Relu en entier tous les 28 jours ; un passage
        # interrompu reprend la ou il s'etait arrete.
        id: bw_sites
        continue-on-error: true
        timeout-minutes: 45
        env:
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
        run: python3 scripts/update_bw_sites.py

      - name: Etablissements agrees (Mattilsynet)
        id: estab
        continue-on-error: true
        run: python3 scripts/fetch_establishments.py --update

      - name: Flux de saumon dans l'UE (Eurostat Comext)
        # Importations des 27 pays par origine, exportations du Danemark, de la
        # Pologne et des Pays-Bas par destination et par forme. Ne retelecharge
        # que si Eurostat a publie depuis le dernier passage.
        id: eurostat
        continue-on-error: true
        timeout-minutes: 30
        run: python3 scripts/update_eurostat.py

      - name: Statistiques nationales (Feroe, Islande, Royaume-Uni, Chili, Canada, importations Etats-Unis et Chine)
        # Hagstova Foroya, Hagstofa Islands (API PxWeb) et HMRC (API uktradeinfo) : saumon par pays de
        # destination et par mois, pour l'onglet Producers et l'origine du
        # saumon dans chaque pays de l'UE. Nouvelle source : un echec ne bloque rien.
        id: national
        continue-on-error: true
        timeout-minutes: 35
        env:
          # cle gratuite de l'API du US Census Bureau (secret GitHub CENSUS_API_KEY)
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python3 scripts/update_national_trade.py

      - name: Installer le navigateur sans ecran (Playwright)
        continue-on-error: true
        run: python3 -m playwright install --with-deps chromium

      - name: Etablissements enregistres pour la Chine (GACC CIFER)
        # Pilote la page de recherche publique des douanes chinoises (reponses
        # chiffrees, dechiffrees par la page elle-meme) et lit la liste des
        # etablissements norvegiens. Source fragile : un echec ne bloque rien.
        id: china
        continue-on-error: true
        timeout-minutes: 20
        run: python3 scripts/fetch_china_gacc.py

      - name: Tester le tableau de bord avec les nouvelles donnees
        # Ouvre docs/production.html avec le data.json produit, clique sur
        # chaque onglet et verifie qu'il n'y a ni erreur ni onglet vide.
        id: smoke
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/smoke_test.py data/smoke.json

      - name: Enregistrer l'etat des sources dans data.json
        if: always()
        env:
          STEP_AKVA_FETCH: ${{ steps.akva_fetch.outcome }}
          STEP_AKVA_PARSE: ${{ steps.akva_parse.outcome }}
          STEP_BIOMASSE_FETCH: ${{ steps.biomasse_fetch.outcome }}
          STEP_BIOMASSE_BUILD: ${{ steps.biomasse_build.outcome }}
          STEP_SSB: ${{ steps.ssb.outcome }}
          STEP_SSB_WEEKLY: ${{ steps.ssb_weekly.outcome }}
          STEP_BW_HEALTH: ${{ steps.bw_health.outcome }}
          STEP_BW_SITES: ${{ steps.bw_sites.outcome }}
          STEP_ESTAB: ${{ steps.estab.outcome }}
          STEP_CHINA: ${{ steps.china.outcome }}
          STEP_EUROSTAT: ${{ steps.eurostat.outcome }}
          STEP_NATIONAL: ${{ steps.national.outcome }}
          STEP_SMOKE: ${{ steps.smoke.outcome }}
        run: |
          python3 scripts/write_status.py
          rm -f data/smoke.json

      - name: Publier data.json (et les fichiers bruts telecharges)
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          # data/ entier : data.json et les caches BarentsWatch.
          git add data/ pdf/ xlsx/biomasse/
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise a jour auto Akvafakta + Fiskeridirektoratet + SSB ($(date -u +%Y-%m-%d))"
            # un fichier envoye a la main pendant l'execution ne doit pas faire echouer la publication
            git pull --rebase
            git push
          fi

      - name: Signaler les problemes (e-mail de GitHub)
        # Les donnees sont deja publiees. Cette etape fait seulement passer le
        # passage en rouge si une source ou le test a echoue.
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.akva_fetch.outcome }}" = "failure" ] && FAILED="$FAILED Akvafakta-telechargement"
          [ "${{ steps.akva_parse.outcome }}" = "failure" ] && FAILED="$FAILED Akvafakta-lecture"
          [ "${{ steps.biomasse_fetch.outcome }}" = "failure" ] && FAILED="$FAILED Biomasse-telechargement"
          [ "${{ steps.biomasse_build.outcome }}" = "failure" ] && FAILED="$FAILED Biomasse-reconstruction"
          [ "${{ steps.ssb.outcome }}" = "failure" ] && FAILED="$FAILED SSB"
          [ "${{ steps.bw_health.outcome }}" = "failure" ] && FAILED="$FAILED BarentsWatch-sante"
          [ "${{ steps.bw_sites.outcome }}" = "failure" ] && FAILED="$FAILED BarentsWatch-registre"
          [ "${{ steps.estab.outcome }}" = "failure" ] && FAILED="$FAILED Mattilsynet"
          [ "${{ steps.eurostat.outcome }}" = "failure" ] && FAILED="$FAILED Eurostat"
          [ "${{ steps.smoke.outcome }}" = "failure" ] && FAILED="$FAILED Test-du-tableau-de-bord"
          if [ -n "$FAILED" ]; then
            echo "::error::Etapes en echec :$FAILED (les autres donnees ont bien ete publiees)"
            exit 1
          fi
          echo "Tout s'est bien passe."
