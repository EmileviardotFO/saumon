name: Sonde ponctuelle (mise au point d'un script, sans rien publier)

# Lancement manuel : execute un script de scripts/sondes/ et garde ce qu'il ecrit
# dans sonde_out/ comme artefact telechargeable pendant 7 jours. Rien n'est
# commite : sert a tester une nouvelle source avant de l'ajouter aux mises a jour.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script a lancer (dans scripts/sondes/)"
        required: true
        default: probe_feed.py

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependances
        run: pip install pandas openpyxl xlrd requests pdfplumber websockets
      - name: Lancer la sonde
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY || secrets.AISTREAM_KEY }}
          S_GGLOBALFISHING_KEY: ${{ secrets.GGLOBALFISHING_KEY }}
          S_GLOBALFISHING_KEY: ${{ secrets.GLOBALFISHING_KEY }}
          S_GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
          S_GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          S_GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          S_GFW_KEY: ${{ secrets.GFW_KEY }}
          S_GFW_API: ${{ secrets.GFW_API }}
          S_GFW: ${{ secrets.GFW }}
          S_GLOBAL_FISHING_WATCH: ${{ secrets.GLOBAL_FISHING_WATCH }}
          S_GLOBAL_FISHING_WATCH_TOKEN: ${{ secrets.GLOBAL_FISHING_WATCH_TOKEN }}
          S_GLOBAL_FISHING_WATCH_API_KEY: ${{ secrets.GLOBAL_FISHING_WATCH_API_KEY }}
          S_GLOBALFISHINGWATCH: ${{ secrets.GLOBALFISHINGWATCH }}
          S_FISHING_WATCH_TOKEN: ${{ secrets.FISHING_WATCH_TOKEN }}
          S_GFW_ACCESS_TOKEN: ${{ secrets.GFW_ACCESS_TOKEN }}
          S_API_GFW: ${{ secrets.API_GFW }}
          S_GFW_APIKEY: ${{ secrets.GFW_APIKEY }}
        run: |
          mkdir -p sonde_out
          python3 "scripts/sondes/${{ inputs.script }}" 2>&1 | tee sonde_out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonde-out
          path: sonde_out/
          retention-days: 7
