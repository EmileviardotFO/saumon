name: farming-australie
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: farming-commit
  cancel-in-progress: false
defaults:
  run:
    working-directory: farming
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - name: Relire EPA et portail NRE
        run: python scripts/maj_australie.py --xlsx farming_canada_australie.xlsx --sortie donnees_au --strict
      - name: Publier les changements
        if: always()
        run: |
          git config user.name "farming-australie"; git config user.email "actions@users.noreply.github.com"
          git add -A .   # uniquement le dossier farming/
          git diff --cached --quiet && exit 0
          git commit -m "Australie $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
