name: Summary (signaux de la semaine)

on:
  schedule:
  - cron: 47 7 * * *
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Signaux de la semaine
      run: |
        python3 scripts/build_chile_market.py || true
        python3 scripts/build_big_six.py || true
        python3 scripts/build_summary.py
        python3 scripts/build_basin_cards.py || true
    - name: Inventaire des collectes (panneau Updated)
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 scripts/build_sources.py || true
    - name: Enregistrer
      run: |
        git config user.name "github-actions"; git config user.email "actions@github.com"
        git add data/summary.json data/big_six.json data/basin_cards.json data/sources.json data/chile_market.json
        git diff --cached --quiet && exit 0
        git commit -m "Summary ($(date -u +%Y-%m-%d))"
        for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
