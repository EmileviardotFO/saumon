name: Chili - douanes, bulletins INE regionaux, caligus (chaque semaine)
# Douanes (DUS, donnees ouvertes) : un fichier par mois, publie ~1 mois apres ; INE : Los Lagos et Magallanes chaque mois,
# Aysen chaque trimestre ; Sernapesca : liste des centres a haute dissemination de caligus, mise a jour irreguliere.
# Tout est gratuit (aucune cle) ; un mois ou une liste deja lus ne sont pas retelecharges.
on:
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: maj-donnees
  cancel-in-progress: false
jobs:
  chili:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y -qq p7zip-full p7zip-rar && pip install -q requests pdfplumber
      - name: Douanes - exportations mensuelles de salmonides (DUS)
        id: customs
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/build_chile_customs.py --depuis 2023
      - name: INE regional - Los Lagos, Magallanes, Aysen
        id: regional
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/build_chile_regional.py
      - name: Sernapesca - centres a haute dissemination de caligus
        id: caligus
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/build_chile_caligus.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/chile_customs.json data/chile_customs_cache.json data/chile_regional.json data/chile_caligus.json
          if git diff --staged --quiet; then echo "Aucun changement."; else
            git commit -q -m "Chili : douanes, INE regional, caligus ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done; fi
      - name: Notifier les nouveaux centres a haute dissemination (ticket GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/chile_caligus_new_alerts.md ]; then
            gh issue create --title "Chili - caligus : nouveaux centres a haute dissemination ($(date -u +%Y-%m-%d))" --body-file data/chile_caligus_new_alerts.md
          fi
